spring:
  datasource:
    url: ${HZ_BRAIN_DB_URL}
    username: ${HZ_BRAIN_DB_USERNAME}
    password: ${HZ_BRAIN_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HZ_BRAIN_DB_MAX_POOL_SIZE:30}
      minimum-idle: ${HZ_BRAIN_DB_MIN_IDLE:5}
      connection-timeout: 30000
  data:
    redis:
      host: ${HZ_BRAIN_REDIS_HOST}
      port: ${HZ_BRAIN_REDIS_PORT:6379}
      password: ${HZ_BRAIN_REDIS_PASSWORD}
      database: ${HZ_BRAIN_REDIS_DATABASE:0}
logging:
  level:
    root: INFO
    com.haizhuo.brain: INFO
    com.haizhuo.brain.infrastructure.persistence: WARN
