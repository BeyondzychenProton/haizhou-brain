spring:
  application:
    name: haizhuo-brain-server
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  session:
    timeout: 8h
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
server:
  port: 8080
  shutdown: graceful
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  check-config-location: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  opentelemetry:
    resource-attributes:
      service.name: ${haizhuo.brain.observability.langfuse.service-name:${LANGFUSE_SERVICE_NAME:${OTEL_SERVICE_NAME:haizhuo-brain}}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${HAIZHUO_BRAIN_TRACE_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${LANGFUSE_ENABLED:false}
      endpoint: ${LANGFUSE_OTLP_TRACES_ENDPOINT:http://172.16.1.29:3001/api/public/otel/v1/traces}
      transport: http
      connect-timeout: 3s
      timeout: 5s
      headers: {}
haizhuo:
  brain:
    security:
      session:
        store: redis
        secure-cookie: true
        same-site: Lax
    bootstrap-admin:
      enabled: false
    agent:
      provider: dashscope
      primary-model: qwen-plus
    run-worker:
      enabled: false
    persistence:
      enabled: true
    observability:
      langfuse:
        enabled: ${LANGFUSE_ENABLED:false}
        base-url: ${LANGFUSE_BASE_URL:http://172.16.1.29:3001}
        otlp-endpoint: ${LANGFUSE_OTLP_TRACES_ENDPOINT:http://172.16.1.29:3001/api/public/otel/v1/traces}
        public-key: ${LANGFUSE_PUBLIC_KEY:}
        secret-key: ${LANGFUSE_SECRET_KEY:}
        environment: ${LANGFUSE_ENVIRONMENT:local}
        service-name: ${LANGFUSE_SERVICE_NAME:${OTEL_SERVICE_NAME:haizhuo-brain}}
        capture-content: ${LANGFUSE_CAPTURE_CONTENT:false}
        max-content-chars: ${LANGFUSE_MAX_CONTENT_CHARS:2000}
        score-queue-capacity: ${LANGFUSE_SCORE_QUEUE_CAPACITY:256}
        score-flush-interval-millis: ${LANGFUSE_SCORE_FLUSH_INTERVAL_MILLIS:250}
        ingestion-version: ${LANGFUSE_INGESTION_VERSION:4}
