spring:
  application:
    name: haizhuo-brain-server
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  session:
    timeout: 8h
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
server:
  port: 8080
  shutdown: graceful
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  check-config-location: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 0.1
haizhuo:
  brain:
    security:
      session:
        store: redis
        secure-cookie: true
        same-site: Lax
    bootstrap-admin:
      enabled: false
    agent:
      provider: dashscope
      primary-model: qwen-plus
    persistence:
      enabled: true
