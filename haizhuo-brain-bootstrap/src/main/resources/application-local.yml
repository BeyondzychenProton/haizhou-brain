spring:
  datasource:
    url: ${HZ_BRAIN_DB_URL:jdbc:mysql://127.0.0.1:3306/haizhuo_brain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${HZ_BRAIN_DB_USERNAME:root}
    password: ${HZ_BRAIN_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${HZ_BRAIN_REDIS_HOST:127.0.0.1}
      port: ${HZ_BRAIN_REDIS_PORT:6379}
      database: ${HZ_BRAIN_REDIS_DATABASE:0}
logging:
  level:
    com.haizhuo.brain: DEBUG
    com.haizhuo.brain.infrastructure.persistence: DEBUG
